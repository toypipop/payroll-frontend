name: Secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history without exposing secret values
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=$PWD,target=/scan,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /scan \
            --log-opts=--all --redact=100 --no-banner --log-level error
