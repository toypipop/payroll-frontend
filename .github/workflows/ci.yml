name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Prepare patched npm build tools
        run: sh .github/scripts/prepare-npm.sh
      - run: npm ci

      - name: Nothing reads the user from localStorage
        run: |
          if grep -rn "localStorage" src/ --include="*.ts" --include="*.tsx" | grep -v "^\S*:\s*//"; then
            echo "::error::the session lives in an httpOnly cookie; read the user from useAuth()"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
