map $request_method $safe_method {
    default OTHER;
    GET GET; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; HEAD HEAD; OPTIONS OPTIONS;
}
log_format safe_access escape=json '{"method":"$safe_method","status":$status,"duration":$request_time,"upstream_status":"$upstream_status","request_id":"$upstream_http_x_request_id"}';

server {
    access_log /dev/stdout safe_access;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

