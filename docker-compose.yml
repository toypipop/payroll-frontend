services:
  mysql:
    image: mysql:8.4
    container_name: payroll-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: PayrollDB
      TZ: Asia/Bangkok
    ports:
      - "3306:3306"
    volumes:
      - payroll_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  payroll_mysql_data:
